name: Federated Learning Distributed Simulation

on:
  push:

jobs:
  federated_node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Simulate a set of nodes; extend this list to 20 nodes as needed.
        node: [node1, node2, node3, node4, node5]
    env:
      NODE_ID: ${{ matrix.node }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Simulate Local Training Update, Leader Election, and Snapshot
        run: |
          python - <<'EOF'
          import os, json, time, numpy as np
          
          # Use the node's identifier as seed basis for reproducibility
          node_id = os.environ["NODE_ID"]
          np.random.seed(sum(ord(c) for c in node_id))
          
          # Create a simple synthetic dataset: x in [0,1] and y = 2*x + noise
          x = np.linspace(0, 1, 10)
          noise = np.random.normal(0, 0.1, size=x.shape)
          y = 2 * x + noise
          
          # Initialize the model (a single weight) to w_initial
          w_initial = 0.5
          
          # For a simple linear regression model y_pred = w * x, 
          # the mean squared error loss L = mean((y - w*x)**2)
          # has gradient dL/dw = mean(2*(w*x - y)*x)
          lr = 0.1  # learning rate
          
          grad = np.mean(2 * (w_initial * x - y) * x)
          # One gradient descent update step
          w_updated = w_initial - lr * grad
          
          # Compute the update (difference) to serve as our "local update"
          local_update = w_updated - w_initial
          
          # For leader election we still simulate an election score (higher is better)
          election_score = float(np.random.uniform(0, 100))
          timestamp = time.time()
          
          state = {
              "node_id": node_id,
              "w_initial": float(w_initial),
              "w_updated": float(w_updated),
              "local_update": float(local_update),
              "gradient": float(grad),
              "election_score": election_score,
              "timestamp": timestamp
          }
          
          filename = f"state_{node_id}.json"
          with open(filename, "w") as f:
              json.dump(state, f)
          
          print(f"Node {node_id} updated weight from {w_initial} to {w_updated} (update: {local_update})")
          EOF

      - name: Upload Node State Artifact
        uses: actions/upload-artifact@v4
        with:
          # Each node uploads an artifact named state-<node>
          name: state-${{ matrix.node }}
          path: state_${{ matrix.node }}.json

  aggregator:
    needs: federated_node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Node Artifacts
        uses: actions/download-artifact@v4
        with:
          # Download all artifacts into the "node_states" folder
          path: node_states

      - name: List Downloaded Files for Debugging
        run: |
          echo "Listing contents of node_states directory:"
          ls -R node_states

      - name: Aggregate Global State, Elect Leader, and Compute Consensus Update
        run: |
          python - <<'EOF'
          import glob, json, statistics, sys
          
          # Recursively search for state JSON files in the node_states directory
          files = glob.glob("node_states/**/state_*.json", recursive=True)
          if not files:
              print("No node state files found. Exiting aggregator step.")
              sys.exit(1)
          
          nodes_state = []
          for file in files:
              with open(file, "r") as f:
                  state = json.load(f)
                  nodes_state.append(state)
          
          # Print global snapshot (all node states)
          print("Global Snapshot of Node States:")
          for state in nodes_state:
              print(state)
          
          # Perform Leader Election: choose the node with the highest election_score
          leader = max(nodes_state, key=lambda s: s["election_score"])
          print("\nElected Leader:", leader["node_id"], "with election score", leader["election_score"])
          
          # Compute Consensus: average the local updates (the weight differences)
          updates = [s["local_update"] for s in nodes_state]
          consensus_update = statistics.mean(updates)
          print("\nConsensus Model Update (Average of Local Updates):", consensus_update)
          EOF
        shell: /usr/bin/bash -e {0}
