name: Federated Learning Distributed Simulation

on:
  push:

jobs:
  federated_node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Simulate a set of nodes; extend this list to 20 nodes as needed.
        node: [node1, node2, node3, node4, node5]
    env:
      NODE_ID: ${{ matrix.node }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Simulate Local Training Update, Hyperparameter Tuning, and Snapshot
        run: |
          python - <<'EOF'
          import os, json, time, numpy as np
          
          # Get unique node identifier from the environment
          node_id = os.environ["NODE_ID"]
          # Use the node_id to seed the random generator for reproducibility per node
          np.random.seed(sum(ord(c) for c in node_id))
          
          # Create a synthetic dataset: 10 points, x in [0,1]
          x = np.linspace(0, 1, 10)
          noise = np.random.normal(0, 0.1, size=x.shape)
          y = 2 * x + noise
          
          # Candidate hyperparameter: learning rate sampled between 0.05 and 0.15
          lr = float(np.random.uniform(0.05, 0.15))
          
          # Initialize model weight for a simple linear regression (y_pred = w * x)
          w_initial = 0.5
          # Compute gradient of mean squared error loss L = mean((w*x - y)^2)
          grad = np.mean(2 * (w_initial * x - y) * x)
          # Perform one gradient descent update
          w_updated = w_initial - lr * grad
          # Local update is the change in weight
          local_update = w_updated - w_initial
          
          # Compute a validation loss at the updated weight (MSE on the training data)
          validation_loss = np.mean((w_updated * x - y) ** 2)
          # For leader election, a higher score is better; we use negative loss so lower loss wins.
          election_score = -validation_loss
          
          timestamp = time.time()
          
          # Save the node's state in a dictionary
          state = {
              "node_id": node_id,
              "lr": lr,
              "w_initial": float(w_initial),
              "w_updated": float(w_updated),
              "local_update": float(local_update),
              "gradient": float(grad),
              "validation_loss": float(validation_loss),
              "election_score": election_score,
              "timestamp": timestamp
          }
          
          filename = f"state_{node_id}.json"
          with open(filename, "w") as f:
              json.dump(state, f)
          
          print(f"Node {node_id}: lr={lr:.4f}, updated weight from {w_initial} to {w_updated:.4f}, validation loss={validation_loss:.4f}")
          EOF

      - name: Upload Node State Artifact
        uses: actions/upload-artifact@v4
        with:
          # Upload each node's JSON state file using a distinct artifact name
          name: state-${{ matrix.node }}
          path: state_${{ matrix.node }}.json

  aggregator:
    needs: federated_node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Node Artifacts
        uses: actions/download-artifact@v4
        with:
          # Download artifacts into the "node_states" directory
          path: node_states

      - name: List Downloaded Files for Debugging
        run: |
          echo "Listing contents of node_states directory:"
          ls -R node_states

      - name: Aggregate Global State, Elect Best Configuration, and Compute Consensus
        run: |
          python - <<'EOF'
          import glob, json, statistics, sys
          
          # Recursively find all state JSON files in the node_states directory
          files = glob.glob("node_states/**/state_*.json", recursive=True)
          if not files:
              print("No node state files found. Exiting aggregator step.")
              sys.exit(1)
          
          nodes_state = []
          for file in files:
              with open(file, "r") as f:
                  state = json.load(f)
                  nodes_state.append(state)
          
          print("Global Snapshot of Node States:")
          for state in nodes_state:
              print(state)
          
          # Leader Election: choose the node with the highest election_score (i.e. lowest validation_loss)
          best_config = max(nodes_state, key=lambda s: s["election_score"])
          print("\nBest Hyperparameter Configuration from:", best_config["node_id"])
          print("Learning Rate:", best_config["lr"])
          print("Updated Weight:", best_config["w_updated"])
          print("Validation Loss:", best_config["validation_loss"])
          
          # For consensus, we can compute the average learning rate and average local update
          avg_lr = statistics.mean([s["lr"] for s in nodes_state])
          avg_update = statistics.mean([s["local_update"] for s in nodes_state])
          print("\nAverage Learning Rate across nodes:", avg_lr)
          print("Average Local Update across nodes:", avg_update)
          EOF
        shell: /usr/bin/bash -e {0}
